name: tests

on:
  push:
    branches: [1.x]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        laravel: ['9.*', '10.*', '11.*', '12.*', '13.*']
        include:
          - laravel: '9.*'
            testbench: '7.*'
          - laravel: '10.*'
            testbench: '8.*'
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        # Each Laravel major only on the PHP versions it supports
        # (laravel.com/docs/13.x/releases#support-policy):
        # 9 on 8.1-8.2, 10 on 8.1-8.3, 11 on 8.2-8.4, 12 on 8.2-8.5, 13 on 8.3-8.5.
        exclude:
          - laravel: '9.*'
            php: '8.3'
          - laravel: '9.*'
            php: '8.4'
          - laravel: '9.*'
            php: '8.5'
          - laravel: '10.*'
            php: '8.4'
          - laravel: '10.*'
            php: '8.5'
          - laravel: '11.*'
            php: '8.1'
          - laravel: '11.*'
            php: '8.5'
          - laravel: '12.*'
            php: '8.1'
          - laravel: '13.*'
            php: '8.1'
          - laravel: '13.*'
            php: '8.2'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    # PHP 8.5 is new to this suite: report it, do not block on it, until it has gone green once.
    continue-on-error: ${{ matrix.php == '8.5' }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --prefer-stable --no-interaction --no-progress --with-all-dependencies

      - name: Run the test suite
        run: vendor/bin/phpunit

  lowest:
    # Informational: proves the lowest versions composer.json allows still work.
    runs-on: ubuntu-latest
    continue-on-error: true
    name: Lowest dependencies (PHP 8.2 / Laravel 11)

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install lowest dependencies
        run: |
          composer require "laravel/framework:11.*" "orchestra/testbench:9.*" --dev --no-interaction --no-update
          composer update --prefer-dist --prefer-lowest --no-interaction --no-progress --with-all-dependencies

      - name: Run the test suite
        run: vendor/bin/phpunit

  validate:
    runs-on: ubuntu-latest
    name: composer.json is valid
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer validate --strict
